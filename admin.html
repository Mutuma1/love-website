

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Love Admin</title>
<style>
body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;
background:linear-gradient(135deg,#ff5f8a,#ff87b7);font-family:Segoe UI;}
.card{background:#fff;padding:30px;width:380px;border-radius:20px;box-shadow:0 25px 45px rgba(0,0,0,.25);}
input,button{width:100%;padding:12px;margin:8px 0;border-radius:12px;border:1px solid #ccc;}
button{background:#ff3f7f;color:#fff;border:none;cursor:pointer;}
</style>
</head>
<body>
<div class="card">
<h2>🔐 Love Admin</h2>
<input id="receiver" placeholder="Receiver name">
<input id="sender" placeholder="Sender name">
<input id="youtube" placeholder="YouTube Video ID (e.g. dQw4w9WgXcQ)">
<button onclick="saveData()">💾 Save & Generate Link</button>
</div>

<script type="module">
import { db } from "./firebase.js";
import { ref, push, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const receiverInput = document.getElementById("receiver");
const senderInput = document.getElementById("sender");
const youtubeInput = document.getElementById("youtube");

window.saveData = async function(){
  const receiver = receiverInput.value.trim();
  const sender = senderInput.value.trim();
  const youtubeID = youtubeInput.value.trim();

  if(!receiver || !sender){
    alert("Please fill in receiver and sender 💖");
    return;
  }

  // Push new record
  const newRef = push(ref(db, "loveData"));
  await set(newRef, {
    receiver,
    sender,
    youtubeID,
    createdAt: Date.now(),
    clicks: {}
  });

  const link = `${location.origin}/index.html?id=${newRef.key}`;
  prompt("Share this link 💖", link);
};
</script>
</body>
</html>
