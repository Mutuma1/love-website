

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>A Question 💖</title>
<style>
body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;
background:linear-gradient(135deg,#ff5f8a,#ff9acb);font-family:Segoe UI;}
.card{background:#fff;padding:35px;width:360px;border-radius:20px;text-align:center;position:relative;}
button{width:100%;padding:12px;margin:10px 0;border-radius:30px;border:none;font-size:16px;cursor:pointer;}
.yes{background:#ff3f7f;color:#fff;}
.no{background:#aaa;color:#fff;}
</style>
</head>
<body>
<div class="card">
<h1>Hello <span id="name">My Love</span> 💖</h1>
<p>Would you like to read my message?</p>
<button class="yes" onclick="go('yes')">✨ Yes please</button>
<button class="no" id="noBtn" onclick="go('no')">🙈 No thanks</button>
</div>

<script type="module">
import { db } from "./firebase.js";
import { ref, get, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const params = new URLSearchParams(location.search);
const id = params.get("id");
localStorage.setItem("loveId", id);

if(id){
  const snap = await get(ref(db, "loveData/" + id));
  if(snap.exists()){
    const data = snap.val();
    document.getElementById("name").textContent = data.receiver;
    localStorage.setItem("receiver", data.receiver);
    localStorage.setItem("sender", data.sender);
    localStorage.setItem("youtubeID", data.youtubeID);
  }
}

window.go = async function(btn){
  const clickRef = ref(db, "loveData/" + id + "/clicks/" + Date.now());
  await update(clickRef, { button: btn, time: new Date().toISOString() });
  location.href = btn + ".html?id=" + id;
};
</script>
</body>
</html>
