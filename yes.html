<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Golden Message ✨</title>
<style>
body{
  margin:0;padding:20px;background:linear-gradient(135deg,#ff9acb,#ffd1e8);
  font-family:Segoe UI,sans-serif;
}
.card{
  max-width:700px;margin:auto;background:white;padding:30px;
  border-radius:20px;box-shadow:0 20px 40px rgba(0,0,0,.2);
}
h1{color:#ff3f7f;text-align:center}
ul{font-size:16px}
button{
  width:100%;padding:12px;border:none;border-radius:30px;
  background:#ff3f7f;color:white;font-size:16px;margin-top:15px;cursor:pointer;
}
iframe{width:100%;height:315px;border-radius:15px;margin-top:15px}
</style>
</head>
<body>
<div class="card">
  <h1>Thank You for Saying Yes 💖</h1>
  <p>You are loved because:</p>
  <ul>
    <li>🌸 Your smile changes moods instantly</li>
    <li>💫 Your heart is genuinely kind</li>
    <li>🔥 You inspire growth and courage</li>
    <li>💖 You are simply unforgettable</li>
  </ul>

  <p>This song describes you 🎶</p>
  <iframe id="song" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>

  <button onclick="goFinal()">💍 I Accept / Let’s Continue</button>
  <button onclick="restart()">🔄 Restart Again</button>
</div>

<script>
// Load YouTube ID from admin
const ytID = localStorage.getItem("youtubeID") || "dQw4w9WgXcQ"; // default RickRoll 😉
document.getElementById("song").src = "https://www.youtube.com/embed/" + ytID;

function goFinal(){ window.location.href="final.html"; }
function restart(){ window.location.href="index.html"; }
</script>
</body>
</html>
