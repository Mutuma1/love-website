

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>The Golden Message ✨</title>
<style>
body{margin:0;padding:20px;background:#ffd1e8;font-family:Segoe UI;}
.card{background:#fff;padding:30px;border-radius:20px;max-width:600px;margin:auto;}
button{width:100%;padding:12px;border-radius:30px;border:none;background:#ff3f7f;color:#fff;margin-top:15px;cursor:pointer;}
iframe{width:100%;height:315px;border-radius:15px;}
</style>
</head>
<body>
<div class="card">
<h1>Thank You <span id="name"></span> 💖</h1>
<ul>
<li>🌸 Your smile changes moods instantly</li>
<li>💫 Your heart is genuinely kind</li>
<li>🔥 You inspire growth and courage</li>
<li>💖 You are simply unforgettable</li>
</ul>
<p>This song describes you 🎶</p>
<iframe id="song" src="" allowfullscreen></iframe>
<button onclick="goFinal()">💍 Continue</button>
</div>

<script>
document.getElementById("name").textContent = localStorage.getItem("receiver");
document.getElementById("song").src =
`https://www.youtube.com/embed/${localStorage.getItem("youtubeID")}?autoplay=1&mute=1`;

function goFinal(){
  const id = localStorage.getItem("loveId");
  location.href = "final.html?id=" + id;
}
</script>
</body>
</html>
